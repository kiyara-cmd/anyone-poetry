<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anyone Poetry</title>
<style>
:root{--bg:#faf6ef;--card:#fff;--ink:#241c15;--mute:#7a6c5d;--acc:#b4442b;--acc2:#f1e3d3;--line:#e6d9c8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17120e;--card:#221b15;--ink:#f3eadf;--mute:#a39583;--acc:#e8704f;--acc2:#33271d;--line:#3a2e24}}
:root[data-theme="dark"]{--bg:#17120e;--card:#221b15;--ink:#f3eadf;--mute:#a39583;--acc:#e8704f;--acc2:#33271d;--line:#3a2e24}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,'Times New Roman',serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 60px}
h1{font-size:30px;margin:8px 0 4px;letter-spacing:-.5px}
h2{font-size:20px;margin:0 0 10px}
p.sub{color:var(--mute);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:13px 18px;background:var(--acc);color:#fff;font-weight:bold;width:100%}
button.alt{background:var(--acc2);color:var(--ink)}
button.sm{width:auto;padding:8px 12px;font-size:14px}
button:disabled{opacity:.5}
.row{display:flex;gap:10px}
.row>*{flex:1}
input,textarea,select{width:100%;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
textarea{min-height:190px;resize:vertical}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{background:var(--acc2);color:var(--ink);padding:10px}
.tabs button.on{background:var(--acc);color:#fff}
.poem{border-bottom:1px solid var(--line);padding:12px 0}
.poem:last-child{border:0}
.poem b{display:block}
.poem pre{white-space:pre-wrap;font:inherit;color:var(--mute);margin:6px 0;max-height:60px;overflow:hidden}
.j{border-left:4px solid var(--acc);padding:4px 0 4px 12px;margin:14px 0}
.j small{color:var(--mute);text-transform:uppercase;letter-spacing:1px}
.score{float:right;font-size:22px;color:var(--acc);font-weight:bold}
.mute{color:var(--mute);font-size:14px}
.big{display:grid;gap:12px}
.big button{padding:22px;font-size:20px}
.hide{display:none}
.lvl button{font-size:13px;padding:10px 4px}
.stagepre{white-space:pre-wrap;font:inherit;font-size:20px;line-height:1.7;margin:12px 0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var LV={easy:{n:'Easy honest',p:'Easy honest. Warm and encouraging. Lead with strengths, turn criticism into gentle suggestions, scores slightly generous, but never lie about real problems.'},honest:{n:'Just honest',p:'Just honest. Balanced and fair, exactly like a real competition judge.'},brutal:{n:'Brutally honest',p:'Brutally honest. Straight-up blunt, funny roast energy about weak lines, no sugarcoating, low scores when earned. Roast the POEM only, never the person: no insults about who they are, no slurs, no cruelty. It should feel like a tough friend who believes in them. End the confidence paragraph with a real reason to stay confident.'}};
var S={level:'honest',days:[],sessions:0,rec:'',mr:null,pid:-1,tsec:0,tid:0,gender:null,poems:[],tab:'practice',draft:{t:'',b:''},busy:false,result:null,err:''};
var OPEN={w:['Queen...','Girlll...','Okay girl...','Sis...','Babe...'],m:['Man...','Dude...','Bro...','Yo man...','Bruh...']};
function load(){try{var d=JSON.parse(localStorage.getItem('ap')||'{}');S.gender=d.gender||null;S.poems=d.poems||[];S.days=d.days||[];S.level=d.level||'honest';S.sessions=d.sessions||0;}catch(e){}}
function save(){try{localStorage.setItem('ap',JSON.stringify({gender:S.gender,poems:S.poems,days:S.days,sessions:S.sessions,level:S.level}));}catch(e){}}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function render(){
  var a=document.getElementById('app');
  if(!S.gender){
    a.innerHTML='<h1>Anyone Poetry</h1><p class="sub">Practice in front of honest judges before the real stage. First, who are you?</p><div class="big"><button id="gw">I\'m a woman</button><button id="gm" class="alt">I\'m a man</button></div><p class="mute" style="margin-top:16px">This only decides how the judges talk to you.</p>';
    document.getElementById('gw').onclick=function(){S.gender='w';save();render();};
    document.getElementById('gm').onclick=function(){S.gender='m';save();render();};
    return;
  }
  var h='<h1>Anyone Poetry</h1><p class="sub">'+(S.gender=='w'?'Step up, queen. The judges are ready.':'Step up, man. The judges are ready.')+'</p><p class="mute" style="margin-top:-14px">🔥 '+streak()+'-day streak · '+S.sessions+' practices</p>';
  h+='<div class="tabs"><button data-t="practice" class="'+(S.tab=='practice'?'on':'')+'">Practice</button><button data-t="stage" class="'+(S.tab=='stage'?'on':'')+'">Stage</button><button data-t="mine" class="'+(S.tab=='mine'?'on':'')+'">My poems ('+S.poems.length+')</button></div>';
  if(S.tab=='practice'){
    h+='<div class="card"><input id="t" placeholder="Poem title" value="'+esc(S.draft.t).replace(/"/g,'&quot;')+'"><textarea id="b" placeholder="Paste or write your poem here...">'+esc(S.draft.b)+'</textarea>';
    h+=levelHTML()+'<div class="row"><button id="go"'+(S.busy?' disabled':'')+'>'+(S.busy?'Judges are reading...':'Face the judges')+'</button><button id="sv" class="alt">Save poem</button></div></div>';
    if(S.err)h+='<p class="mute">'+esc(S.err)+'</p>';
    if(S.result)h+=resultHTML(S.result);
  }else if(S.tab=='stage'){h+=stageHTML();}else{
    if(!S.poems.length)h+='<div class="card mute">No poems yet. Save one from the Practice tab.</div>';
    else{h+='<div class="card">';S.poems.forEach(function(p,i){
      h+='<div class="poem"><b>'+(p.best?'⭐ ':'')+esc(p.t||'Untitled')+(p.score?' <span class="mute">· best score '+p.score+'/10</span>':'')+'</b><pre>'+esc(p.b)+'</pre><div class="row"><button class="sm alt" data-a="use" data-i="'+i+'">Practice</button><button class="sm alt" data-a="star" data-i="'+i+'">'+(p.best?'Unstar':'Mark best')+'</button><button class="sm alt" data-a="del" data-i="'+i+'">Delete</button></div></div>';});
      h+='</div><p class="mute">Starred poems are your picks for the real competition.</p>';}
  }
  h+='<p style="text-align:center"><a href="#" id="sw" class="mute">Switch gender</a></p>';
  a.innerHTML=h;
  a.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){keep();S.tab=b.dataset.t;S.err='';render();};});
  document.getElementById('sw').onclick=function(e){e.preventDefault();S.gender=null;save();render();};
  if(S.tab=='practice'){document.getElementById('go').onclick=judge;document.getElementById('sv').onclick=function(){keep();savePoem();};}
  a.querySelectorAll('[data-l]').forEach(function(b){b.onclick=function(){keep();S.level=b.dataset.l;save();render();};});
  if(S.tab=='stage')bindStage();
  a.querySelectorAll('[data-a]').forEach(function(b){b.onclick=function(){var i=+b.dataset.i,p=S.poems[i];
    if(b.dataset.a=='use'){S.draft={t:p.t,b:p.b};S.tab='practice';S.result=null;}
    if(b.dataset.a=='star')p.best=!p.best;
    if(b.dataset.a=='del')S.poems.splice(i,1);
    save();render();};});
}
function keep(){var t=document.getElementById('t'),b=document.getElementById('b');if(t){S.draft.t=t.value;S.draft.b=b.value;}}
function savePoem(){if(!S.draft.b.trim())return;var t=S.draft.t.trim()||'Untitled';var ex=S.poems.filter(function(p){return p.t==t&&p.b==S.draft.b;})[0];if(!ex)S.poems.unshift({t:t,b:S.draft.b,best:false,score:0});save();S.tab='mine';render();}
function resultHTML(r){
  var h='<h2>The panel says <span class="mute">· '+LV[S.level].n+'</span></h2>'+(r.offline?'<p class="mute">Offline mode: simpler judges that run on your phone with no internet. Connect for the full AI panel.</p>':'');
  r.judges.forEach(function(j){h+='<div class="j"><span class="score">'+esc(String(j.score))+'/10</span><small>'+esc(j.name)+'</small><div>'+esc(j.feedback)+'</div></div>';});
  h+='<div class="card"><b>Average: '+r.avg+'/10</b><p>'+esc(r.confidence)+'</p></div>';
  return h;
}
async function judge(){
  keep();
  if(S.draft.b.trim().length<20){S.err='Write a bit more first. The judges need something to read.';render();return;}
  S.busy=true;S.err='';S.result=null;render();
  var sample=null;
  sample=null;
  if(!sample){return finish(localJudge());}
  var g=S.gender=='w'?'a woman':'a man';
  var op=OPEN[S.gender].join(' / ');
  var prompt='You are a panel of 3 poetry competition judges giving feedback on a poem written by '+g+' who is practicing before a real contest.\n'
  +'Judges: "The Technician" (craft, form, rhythm, word choice), "The Heart" (emotion, honesty, originality), "The Crowd Reader" (stage delivery, memorability, impact on an audience).\n'
  +'LEVEL: '+LV[S.level].p+'\n'
  +'RULES: Be HONEST like real competition judges. Do not inflate scores. Name real weaknesses specifically (quote a weak line briefly), and real strengths too. 2-4 sentences each, casual spoken tone. Every judge\'s feedback MUST begin with one of these openers, varied across judges: '+op+' then continue the sentence naturally. Score 1-10 (a typical decent amateur poem is 5-6; 9-10 is rare).\n'
  +'Also write one "confidence" paragraph (2-3 sentences): the single most important thing to fix, plus one genuine reason they should feel sure of themselves. Same casual opener style.\n'
  +'Return ONLY JSON: {"judges":[{"name":"The Technician","score":6,"feedback":"..."},{"name":"The Heart","score":6,"feedback":"..."},{"name":"The Crowd Reader","score":6,"feedback":"..."}],"confidence":"..."}\n\n'
  +'TITLE: '+S.draft.t+'\nPOEM:\n'+S.draft.b.slice(0,4000);
  try{
    var r=await sample.json(prompt,{cache:false});
    finish(r);
  }catch(e){finish(localJudge());}
}
function finish(r){
  markPractice();
  var sc=r.judges.map(function(j){return +j.score||0;});
  r.avg=(sc.reduce(function(a,b){return a+b;},0)/sc.length).toFixed(1);
  S.result=r;
  var ex=S.poems.filter(function(p){return p.b==S.draft.b;})[0];
  if(ex&&+r.avg>(ex.score||0)){ex.score=+r.avg;save();}
  S.busy=false;render();
}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function levelHTML(){return '<p class="mute" style="margin:0 0 6px">Judge level</p><div class="row lvl" style="margin-bottom:12px">'+['easy','honest','brutal'].map(function(k){return '<button class="sm '+(S.level==k?'':'alt')+'" data-l="'+k+'">'+LV[k].n+'</button>';}).join('')+'</div>';}
function key(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function streak(){var n=0;for(var k=0;k<400;k++){var d=new Date();d.setDate(d.getDate()-k);if(S.days.indexOf(key(d))>-1)n++;else if(k>0)break;}return n;}
function markPractice(){var k=key(new Date());if(S.days.indexOf(k)<0)S.days.push(k);S.sessions++;save();}
function fmt(s){return Math.floor(s/60)+':'+('0'+s%60).slice(-2);}
function stageHTML(){
  var o='<option value="-1"'+(S.pid<0?' selected':'')+'>Current draft</option>';
  S.poems.forEach(function(p,i){o+='<option value="'+i+'"'+(S.pid==i?' selected':'')+'>'+esc(p.t||'Untitled')+'</option>';});
  var txt=S.pid>=0&&S.poems[S.pid]?S.poems[S.pid].b:S.draft.b;
  var h='<div class="card"><select id="sp">'+o+'</select><pre class="stagepre">'+(txt.trim()?esc(txt):'Nothing here yet. Write or save a poem first.')+'</pre>';
  h+='<p class="mute">Stand up, breathe, read slow, and pause before the last line.</p><p style="font-size:34px;text-align:center;margin:8px 0" id="tm">'+fmt(S.tsec)+'</p>';
  h+='<div class="row"><button id="tb" class="alt">'+(S.tid?'Stop timer':'Start timer')+'</button><button id="rb" class="alt">'+(S.mr&&S.mr.state=='recording'?'Stop recording':'Record me')+'</button></div>';
  if(S.rec)h+='<audio controls src="'+S.rec+'" style="width:100%;margin-top:12px"></audio>';
  if(S.err)h+='<p class="mute">'+esc(S.err)+'</p>';
  return h+'<button id="rd" style="margin-top:12px">I read it out loud ✓</button></div>';
}
function bindStage(){
  document.getElementById('sp').onchange=function(){S.pid=+this.value;render();};
  document.getElementById('tb').onclick=function(){if(S.tid){clearInterval(S.tid);S.tid=0;}else{S.tsec=0;S.tid=setInterval(function(){S.tsec++;var e=document.getElementById('tm');if(e)e.textContent=fmt(S.tsec);},1000);}render();};
  document.getElementById('rb').onclick=toggleRec;
  document.getElementById('rd').onclick=function(){markPractice();S.err='Nice. Practice logged. Streak: '+streak()+' day(s).';render();};
}
async function toggleRec(){
  if(S.mr&&S.mr.state=='recording'){S.mr.stop();return;}
  try{var st=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[];S.mr=new MediaRecorder(st);
    S.mr.ondataavailable=function(e){ch.push(e.data);};
    S.mr.onstop=function(){st.getTracks().forEach(function(t){t.stop();});S.rec=URL.createObjectURL(new Blob(ch,{type:S.mr.mimeType||'audio/mp4'}));render();};
    S.mr.start();S.err='';render();}
  catch(e){S.err='Mic not available. Allow microphone access for this page.';render();}
}
function localJudge(){
  var body=S.draft.b,low=body.toLowerCase();
  var lines=body.split('\n').map(function(l){return l.trim();}).filter(Boolean);
  var words=low.match(/[a-z']+/g)||[];var n=Math.max(words.length,1);
  function cnt(a){return a.filter(function(c){return low.indexOf(c)>-1;});}
  function syl(w){var m=w.replace(/e$/,'').match(/[aeiouy]+/g);return m?m.length:1;}
  var uniq=new Set(words).size/n;
  var ends=lines.map(function(l){return((l.toLowerCase().match(/[a-z']+/g)||['']).pop()).slice(-2);});
  var rh=0;for(var i=0;i<ends.length-1;i++){if(ends[i]&&(ends[i]==ends[i+1]||(ends[i+2]&&ends[i]==ends[i+2])))rh++;}
  var al=0;for(i=0;i<words.length-1;i++){if(words[i].length>3&&words[i][0]==words[i+1][0])al++;}
  var cl=cnt(['heart of gold','broken heart','tears fall','tears like rain','love is blind','time heals','stars in the sky','roses are red','soul mate','dark as night','cold as ice','fire inside','end of the road','sea of','wings to fly','rollercoaster']);
  var sen=cnt(['smell','taste','rust','salt','smoke','velvet','bitter','sweet','whisper','scent','dust','glow','sting','ache','gravel','honey','ash','static','hum','chalk','burn','crack','shiver','copper','rain on']);
  var ab=words.filter(function(w){return['love','pain','hope','dream','soul','life','heart','forever','sadness','happiness'].indexOf(w)>-1;}).length/n;
  var fill=words.filter(function(w){return['very','really','just','so','quite','literally','totally','always','never'].indexOf(w)>-1;}).length/n;
  var sims=(low.match(/\blike a\b|\bas \w+ as\b|\bis a\b|\bwas a\b|\bis the\b|\bare the\b/g)||[]).length;
  var turn=/\b(but|yet|until|still|however|instead)\b/.test(low);
  var spec=(body.match(/\d+|[a-z,;] [A-Z][a-z]+/g)||[]).length;
  var sy=lines.map(function(l){return(l.toLowerCase().match(/[a-z']+/g)||[]).reduce(function(a,w){return a+syl(w);},0);});
  var mean=sy.reduce(function(a,b){return a+b;},0)/sy.length;
  var sd=Math.sqrt(sy.reduce(function(a,x){return a+(x-mean)*(x-mean);},0)/sy.length);
  var lastLen=(lines[lines.length-1].match(/\S+/g)||[]).length;
  var seen={},rep=0;lines.forEach(function(l){var k=l.toLowerCase();if(seen[k])rep++;seen[k]=1;});
  var fw=(lines[0].toLowerCase().match(/[a-z']+/g)||[]).filter(function(w){return w.length>4;});
  var circ=fw.some(function(w){return lines[lines.length-1].toLowerCase().indexOf(w)>-1;});
  var hook=(lines[0].match(/\S+/g)||[]).length<=9;
  var T=[],H=[],C=[];
  function add(L,ok,g,b){L.push({ok:ok,t:pick(ok?g:b)});}
  add(T,uniq>=.5||n<20,['your word choice has real variety.','you are not wasting words, the vocabulary stays fresh.'],['you keep reusing the same words and it does not feel intentional.','the vocabulary is thin, I kept hearing the same words come back.']);
  add(T,fill<.05,['no lazy filler words, that is clean writing.','you kept the filler out, nice.'],['cut the "very, really, just, so" type words, they water down every line.','too much filler like "really" and "just", delete half of it.']);
  add(T,rh>=2||al>=2,['I can hear sound patterns working, rhyme or repeated sounds.','there is music in how the lines land.'],['the lines have no sound pattern, no rhyme and no repeated sounds, so it reads flat out loud.','I did not hear any music in it, play with rhyme or repeating sounds.']);
  add(T,sd/Math.max(mean,1)<.3,['the rhythm stays steady line to line.','your line lengths feel controlled.'],['line lengths jump all over, the rhythm feels random, not chosen.','the rhythm is uneven and it will trip you on stage.']);
  add(T,cl.length==0,['no cliches, that is rare.','I did not catch any cliches, good.'],['"'+(cl[0]||'')+'" is a cliche. Judges have heard it a hundred times.','you used "'+(cl[0]||'')+'", a cliche. Find your own way to say it.']);
  add(H,sen.length>=2,['you use real sensory detail, I can almost touch it.','the sensory images make me feel it, not just read it.'],['I want to smell, touch or taste something. Right now I am only being told how you feel.','no sensory detail at all, it stays in your head and never reaches mine.']);
  add(H,ab<.05,['you did not hide behind big words like love or pain.','you stayed concrete, good.'],['too many huge abstract words like love, pain, soul. Show me one real moment instead.','"love", "pain" and "soul" do the work for you. Make the scene do it.']);
  add(H,spec>=2,['there are specific names and details, so it feels real.','specific details make this feel lived in.'],['it is all general. Give me a name, a place, a number, something only you would know.','nothing specific, it could be anyone\'s poem.']);
  add(H,sims>=1,['you reach for comparisons, I liked that.','there is a metaphor or comparison in there, keep that instinct.'],['no metaphor or comparison anywhere. Say it a way nobody else would.','it is very literal, risk one strange comparison.']);
  add(H,turn,['the poem shifts direction at some point, that gives it a spine.','there is a turn in the middle, it keeps me interested.'],['it stays on one note the whole time, a real poem needs a turn or a surprise.','nothing changes from start to end, give me a twist or a shift.']);
  add(C,lines.length>=8&&lines.length<=35,['the length suits the stage.','good length, the room will stay with you.'],[lines.length<8?'it is short, the room will barely settle in before it ends.':'it runs long, you will lose people.',lines.length<8?'very brief, add a stanza or make every line count even more.':'trim it, long poems drain a crowd.']);
  add(C,hook,['your opening line is short and grabs attention.','strong, tight opening.'],['the first line is long and slow, open with something that hooks them.','the opening does not grab me, start with your strongest image.']);
  add(C,lastLen<=8,['the short last line can land hard, practice the pause before it.','a punchy ending, good.'],['the ending is wordy and fades out. End on the line people remember.','the last line trails off, make it the knockout.']);
  add(C,rep>0||circ,['a repeated line or echo gives the audience something to hold.','I like how it circles back, that sticks in the memory.'],['nothing repeats, so nothing sticks. Try a refrain or echo the first line at the end.','try bringing back your opening idea at the end so it stays with them.']);
  var bad=[];
  function lo(t){return t.charAt(0).toLowerCase()+t.slice(1);}
  function up(t){return t.charAt(0).toUpperCase()+t.slice(1);}
  function fin(L,name){
    var g=L.filter(function(x){return x.ok;}),b=L.filter(function(x){return!x.ok;});
    var sc=Math.round(5+(g.length-b.length)*.7),parts;
    if(S.level=='easy'){
      sc=Math.min(10,sc+1);
      parts=g.slice(0,2).map(function(x){return up(x.t);}).concat(b.slice(0,1).map(function(x){return pick(['One small thing to polish:','A gentle nudge:','To level up:'])+' '+lo(x.t);}));
    }else if(S.level=='brutal'){
      sc=Math.max(1,sc-1);
      parts=b.slice(0,3).map(function(x){return pick(['Straight up:','Not gonna sugarcoat it:','Real talk:','Let me be blunt:'])+' '+lo(x.t);}).concat(g.slice(0,1).map(function(x){return 'Only thing saving you here: '+lo(x.t);}));
      if(!b.length)parts.push('Honestly I am struggling to roast this one, so go find a harder audience.');
    }else{
      sc=Math.max(2,Math.min(9,sc));
      parts=b.slice(0,2).concat(g.slice(0,b.length?1:2)).map(function(x){return up(x.t);});
    }
    bad=bad.concat(b);
    return{name:name,score:Math.max(1,Math.min(10,sc)),feedback:pick(OPEN[S.gender])+' '+parts.join(' ')};
  }
  var js=[fin(T,'The Technician'),fin(H,'The Heart'),fin(C,'The Crowd Reader')];
  var focus=bad.length?bad[0].t:'keep sharpening it';
  var tl=S.level=='brutal'?' I am hard on the poem because I believe in you, not because I doubt you.':'';
  return{offline:true,judges:js,confidence:pick(OPEN[S.gender])+' '+pick(['Fix one thing first:','Your next move:','Biggest win available:'])+' '+focus.charAt(0).toLowerCase()+focus.slice(1)+' '+pick(['Then read it out loud twice. You wrote a whole poem and showed up to be judged, most people never do.','You already did the hard part by writing it. Now polish and own it.','Judges respect someone who practices. You are doing exactly that.'])+tl};
}
load();render();
</script>
</body>
</html>
